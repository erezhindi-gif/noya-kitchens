# Every 10 minutes: asks the site to bring in quote requests labeled in Gmail (and send the auto-reply).
# Runs on GitHub, so it works with every computer off.
name: Quote requests from Gmail
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS --max-time 90 https://www.noya-k.co.il/api/cron/leads
